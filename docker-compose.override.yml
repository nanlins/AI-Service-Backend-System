# 开发环境覆盖：源码热重载挂载（docker compose 会自动合并本文件）
# 生产部署请使用：docker compose -f docker-compose.yml up -d
services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
    environment:
      DEBUG: "true"

  worker:
    volumes:
      - ./app:/app/app
    environment:
      DEBUG: "true"
